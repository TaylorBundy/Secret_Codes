<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/favicon.ico">
  <title>Códigos Secretos Android</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <h1>📱 Códigos Secretos Android</h1>
  </header>

  <main>
    <section id="selector">
      <label for="marcaSelect">Seleccioná la marca:</label>
      <select id="marcaSelect" onmouseover="Titulos(this.id)">
        <option value="">-- Elegí una marca --</option>
      </select>
      <button id="btnEditar" class="btnsPrincipales" onmouseover="Titulos(this.id)"><img id="btnImage1" src="images/edit_light.avif" alt="">Editar Códigos</button>
    </section>
    <div class="SearchContainer">
      <img id="btnImage" src="images/search.avif" alt="">
      <!-- <span class="searchIcon"></span> -->
      <input type="text" id="searchInput" onmouseover="Titulos(this.id)" placeholder="Buscar por Código o Descripción">
      <div id="contador" onmouseover="Titulos(this.id)">Códigos cargados: 0</div>
    </div>
    <section id="tablaContainer">
      <table id="tablaCodigos">
        <thead>
          <tr>
            <th class="cod">Código</th>
            <th>Descripción</th>
            <th class="rie">Riesgo</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Desarrollado con 💚 estilo Android</p>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/assets.js"></script>
</body>
</html>
